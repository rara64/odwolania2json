# Formaty wartości pól – typ JSON, normalizacja, wzorzec, suma kontrolna.
#
# Pole w field_definitions.yaml wskazuje format przez `type: <nazwa formatu>`.
# Kolejność przetwarzania wartości: normalize → pattern → checksum.
#
# Klucze formatu:
#   json_type    – typ w JSON-ie: string | integer | number
#   description  – postać wartości oczekiwana w JSON-ie (trafia do promptu LLM)
#   normalize    – lista kroków normalizacji odczytanego tekstu
#   pattern      – wyrażenie regularne (Python `re`), które musi spełnić wartość po normalizacji
#   values       – dozwolone wartości (zbiór zamknięty)
#   checksum     – {algorithm, mode}; mode: warn = niezgodna suma kontrolna to tylko
#                  ostrzeżenie w raporcie, wartość zostaje (dane syntetyczne w dev/dane
#                  często mają niepoprawne sumy kontrolne)

version: 1

formats:

  text:
    json_type: string
    normalize: [strip, collapse_whitespace]

  enum:
    json_type: string            # dozwolone wartości w polu `values` pola

  date:
    json_type: string
    description: Data ISO 8601 (RRRR-MM-DD)
    normalize: [strip, date_to_iso]   # akceptuje m.in. 21.03.2026, 21-03-2026, 21 marca 2026 r.
    pattern: '^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$'

  integer:
    json_type: integer

  flag:
    json_type: integer
    values: [0, 1]

  amount:
    json_type: number
    description: Kwota w PLN jako liczba (200.0, nie "200,00 zł")
    normalize: [strip, remove_currency, remove_thousand_separators, decimal_comma_to_dot]
    pattern: '^\d+(\.\d{1,2})?$'

  person_name:
    json_type: string
    description: Imię i nazwisko w mianowniku, bez tytułów (adw., r.pr., dr, mec.)
    normalize: [strip, collapse_whitespace, remove_titles]

  email:
    json_type: string
    normalize: [strip, lowercase]
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  nip:
    json_type: string
    description: 10 cyfr, bez prefiksu PL, myślników i spacji
    normalize: [strip, remove_prefix_PL, digits_only]
    pattern: '^\d{10}$'
    checksum: {algorithm: nip, mode: warn}

  regon:
    json_type: string
    description: 9 lub 14 cyfr
    normalize: [strip, digits_only]
    pattern: '^(\d{9}|\d{14})$'
    checksum: {algorithm: regon, mode: warn}

  krs:
    json_type: string
    description: 10 cyfr (z zerami wiodącymi)
    normalize: [strip, digits_only, {left_pad: {width: 10, char: '0'}}]
    pattern: '^\d{10}$'

  pesel:
    json_type: string
    normalize: [strip, digits_only]
    pattern: '^\d{11}$'
    checksum: {algorithm: pesel, mode: warn}

  bank_account:
    json_type: string
    description: Numer rachunku NRB – 26 cyfr, bez prefiksu PL i spacji
    normalize: [strip, remove_prefix_PL, digits_only]
    pattern: '^\d{26}$'
    checksum: {algorithm: iban_mod97, mode: warn}

  numer_bzp:
    json_type: string
    description: Numer ogłoszenia w Biuletynie Zamówień Publicznych, np. 2026/BZP00999778
    normalize: [strip, uppercase, remove_whitespace]
    pattern: '^\d{4}/BZP\d{8}(/\d{2})?$'

  numer_ted:
    json_type: string
    description: Numer ogłoszenia TED w postaci NNNNNN-RRRR, np. 999137-2026
    normalize:
      - strip
      - {regex_replace: {from: '^(\d{4})/S\s?\d{3}-(\d{6})$', to: '\2-\1'}}   # 2026/S 112-999137 → 999137-2026
    pattern: '^\d{6}-\d{4}$'
