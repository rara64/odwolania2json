<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<title>odwolania2json — Panel</title>
<style>
/* ── reset & base ── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f4f5f7;color:#1a1e2a;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── tab bar ── */
#tabbar{display:flex;background:#ffffff;border-bottom:2px solid #d8dce6;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.tab{padding:12px 30px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.3px;color:#6b7385;border-bottom:3px solid transparent;transition:color .15s,border-color .15s;user-select:none}
.tab:hover{color:#1a1e2a}
.tab.active{color:#1d5cb4;border-bottom-color:#1d5cb4}

/* ── panels ── */
.panel{display:none;flex:1;overflow:hidden}
.panel.active{display:flex}

/* ══════════════════════════════════════════
   WCZYTYWANIE (upload)
══════════════════════════════════════════ */
#panel-upload{flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:36px;background:#f4f5f7}

#dropzone{
  width:100%;max-width:620px;min-height:240px;
  border:2px dashed #b0b8cc;border-radius:12px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  cursor:pointer;transition:border-color .2s,background .2s;padding:32px
}
#dropzone:hover,#dropzone.drag-over{border-color:#1d5cb4;background:#eef3fc}
#dropzone svg{color:#9099b4;opacity:.7}
#dropzone p{color:#6b7385;font-size:14px;text-align:center;line-height:1.5}
#dropzone strong{color:#1a1e2a}

#upload-controls{display:flex;gap:10px;width:100%;max-width:620px;flex-wrap:wrap}

.btn{padding:8px 18px;border-radius:6px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn-primary{background:#1d5cb4;color:#fff;box-shadow:0 1px 3px rgba(29,92,180,.25)}
.btn-primary:hover{background:#1a51a0}
.btn-primary:disabled{background:#a8bcd8;color:#e8eef6;cursor:default;box-shadow:none}
.btn-secondary{background:#fff;color:#3a4460;border:1px solid #c8cdd8}
.btn-secondary:hover{background:#f0f2f7}
.btn-secondary:disabled{color:#b0b8c8;cursor:default}

#file-list{width:100%;max-width:620px;display:flex;flex-direction:column;gap:5px}
.file-pill{background:#fff;border:1px solid #d0d5e0;border-radius:7px;padding:7px 13px;font-size:12px;display:flex;align-items:center;justify-content:space-between;color:#3a4460}
.file-pill .rm{cursor:pointer;color:#a0a8b8;font-size:15px;line-height:1;border:none;background:none;padding:0 2px}
.file-pill .rm:hover{color:#c0392b}

#progress-area{width:100%;max-width:620px;display:none}
.progress-bar-bg{background:#dde1ea;border-radius:6px;height:8px;overflow:hidden}
.progress-bar-fill{height:100%;background:#1d5cb4;transition:width .3s;width:0%}
#progress-label{font-size:12px;color:#6b7385;margin-top:6px}

/* ══════════════════════════════════════════
   PODGLĄD (review)
══════════════════════════════════════════ */
#panel-review{flex-direction:column;overflow:hidden;background:#f4f5f7}

#review-toolbar{background:#fff;border-bottom:1px solid #d8dce6;padding:7px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
#file-selector{background:#fff;color:#1a1e2a;border:1px solid #c8cdd8;border-radius:5px;padding:5px 10px;font-size:13px}
#review-status{font-size:12px;color:#6b7385;margin-left:auto}

#review-body{display:flex;flex:1;overflow:hidden}

/* lewy: podgląd PDF */
#pdf-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid #d8dce6;overflow:hidden;min-width:0}
#pdf-toolbar{background:#f8f9fb;border-bottom:1px solid #e0e4ed;padding:5px 12px;display:flex;align-items:center;gap:10px;font-size:12px;flex-shrink:0}
#pdf-frame{flex:1;width:100%;border:none;background:#e8e8e8}
#pdf-text-view{flex:1;overflow-y:auto;padding:18px;font-size:13px;line-height:1.75;white-space:pre-wrap;font-family:'Courier New',monospace;color:#2a3040;background:#fff;display:none}

/* prawy: JSON */
#json-pane{width:430px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;background:#fff}
#json-pane-header{background:#f8f9fb;border-bottom:1px solid #e0e4ed;padding:7px 14px;font-size:12px;font-weight:600;color:#3a4460;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
#json-scroll{flex:1;overflow-y:auto;padding:10px}

/* drzewo JSON */
.jt-row{display:flex;align-items:flex-start;margin:1px 0;border-radius:4px;transition:background .12s}
.jt-row:hover{background:#f0f3f8}
.jt-key{color:#1d5cb4;font-size:12px;font-family:'Courier New',monospace;white-space:nowrap;flex-shrink:0;padding:2px 0}
.jt-sep{color:#9099b4;padding:2px 2px;font-size:12px}
.jt-val{color:#1a7a1a;font-size:12px;font-family:'Courier New',monospace;word-break:break-all;padding:2px 0;flex:1}
.jt-val.null{color:#9099b4;font-style:italic}
.jt-val.num{color:#b05a00}
.jt-val.bool{color:#8a1a8a}
.jt-prov{margin-left:5px;cursor:pointer;opacity:.35;font-size:11px;line-height:1;padding:2px 5px;border-radius:3px;border:1px solid #c8cdd8;background:#fff;color:#1d5cb4;flex-shrink:0;font-weight:700;transition:opacity .12s,background .12s}
.jt-prov:hover{opacity:1;background:#eef3fc}
.jt-prov[disabled]{cursor:default;opacity:.15;border-color:#e0e4ed}
.jt-toggle{cursor:pointer;color:#9099b4;font-size:11px;user-select:none;padding:2px 4px}
.jt-toggle:hover{color:#3a4460}

/* podświetlenie źródła */
mark.prov-hi{background:#fff59d;color:inherit;border-radius:2px;outline:2px solid #f9a825}

/* ══════════════════════════════════════════
   KONFIGURACJA YAML
══════════════════════════════════════════ */
#panel-yaml{flex-direction:row;overflow:hidden}
#yaml-sidebar{width:210px;flex-shrink:0;background:#fff;border-right:1px solid #d8dce6;display:flex;flex-direction:column;overflow-y:auto}
#yaml-sidebar h3{padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8b93a8;border-bottom:1px solid #e0e4ed;font-weight:700}
.yaml-file-btn{padding:9px 16px;cursor:pointer;font-size:13px;color:#3a4460;border:none;background:transparent;text-align:left;border-left:3px solid transparent;transition:all .12s;width:100%}
.yaml-file-btn:hover{background:#f4f5f7;color:#1a1e2a}
.yaml-file-btn.active{background:#eef3fc;color:#1d5cb4;border-left-color:#1d5cb4;font-weight:600}

#yaml-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#yaml-topbar{background:#f8f9fb;border-bottom:1px solid #e0e4ed;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
#yaml-filename{font-size:13px;color:#6b7385;flex:1}
#yaml-save-status{font-size:12px;color:#1a7a1a}
#yaml-editor-wrap{flex:1;overflow:hidden;position:relative}
#yaml-editor{width:100%;height:100%;background:#fafbfc;color:#1a2a1a;border:none;padding:16px;font-family:'Courier New',monospace;font-size:13px;line-height:1.65;resize:none;outline:none;overflow-y:auto}
#yaml-error{background:#fff3f3;color:#c0392b;font-size:12px;padding:6px 14px;border-top:1px solid #f5c0c0;display:none}

/* stan pusty */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#a0a8b8}
.empty-state svg{opacity:.4}
.empty-state span{font-size:13px}

/* scrollbary */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#f0f2f7}
::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a0a8b8}
</style>
</head>
<body>

<!-- tab bar -->
<div id="tabbar">
  <div class="tab active" data-panel="upload">Wczytywanie</div>
  <div class="tab" data-panel="review">Podgląd</div>
  <div class="tab" data-panel="yaml">Konfiguracja YAML</div>
</div>

<!-- ══════════════════════════════════════════
     PANEL: WCZYTYWANIE
══════════════════════════════════════════ -->
<div id="panel-upload" class="panel active">
  <div id="dropzone" tabindex="0" role="button" aria-label="Upuść pliki PDF tutaj">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="18" x2="12" y2="12"/>
      <polyline points="9 15 12 12 15 15"/>
    </svg>
    <p><strong>Przeciągnij i upuść pliki PDF lub cały folder</strong><br>lub kliknij, aby wybrać pliki</p>
    <input id="file-input" type="file" accept=".pdf" multiple style="display:none"/>
  </div>

  <div id="upload-controls">
    <button class="btn btn-primary" id="btn-process" disabled>Przetwórz</button>
    <button class="btn btn-secondary" id="btn-browse-files">Wybierz pliki</button>
    <button class="btn btn-secondary" id="btn-browse-folder">Wybierz folder</button>
    <button class="btn btn-secondary" id="btn-clear">Wyczyść listę</button>
    <input id="folder-input" type="file" webkitdirectory multiple style="display:none"/>
  </div>

  <div id="file-list"></div>

  <div id="progress-area">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div id="progress-label">Przetwarzanie…</div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PANEL: PODGLĄD
══════════════════════════════════════════ -->
<div id="panel-review" class="panel">
  <div id="review-toolbar">
    <span style="font-size:13px;color:#6b7385">Plik:</span>
    <select id="file-selector">
      <option value="">— brak sesji —</option>
    </select>
    <div style="display:flex;gap:8px;margin-left:8px">
      <button class="btn btn-secondary" id="btn-view-pdf" style="padding:5px 12px;font-size:12px">Widok PDF</button>
      <button class="btn btn-secondary" id="btn-view-text" style="padding:5px 12px;font-size:12px">Widok tekstu</button>
    </div>
    <span id="review-status"></span>
  </div>
  <div id="review-body">
    <div id="pdf-pane">
      <div id="pdf-toolbar">
        <span id="pdf-label" style="color:#6b7385">Nie załadowano dokumentu</span>
      </div>
      <iframe id="pdf-frame"></iframe>
      <div id="pdf-text-view"></div>
    </div>
    <div id="json-pane">
      <div id="json-pane-header">
        <span>Wyekstrahowany JSON</span>
        <button class="btn btn-secondary" id="btn-copy-json" style="padding:3px 10px;font-size:11px">Kopiuj</button>
      </div>
      <div id="json-scroll">
        <div class="empty-state">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span>Przetwórz pliki w zakładce Wczytywanie</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     PANEL: KONFIGURACJA YAML
══════════════════════════════════════════ -->
<div id="panel-yaml" class="panel">
  <div id="yaml-sidebar">
    <h3>Pliki definicji</h3>
    <!-- wypełnia JS -->
  </div>
  <div id="yaml-main">
    <div id="yaml-topbar">
      <span id="yaml-filename">Wybierz plik z panelu po lewej</span>
      <button class="btn btn-primary" id="btn-yaml-save" style="padding:5px 14px;font-size:12px" disabled>Zapisz</button>
      <button class="btn btn-secondary" id="btn-yaml-reload" style="padding:5px 12px;font-size:12px" disabled>Odśwież</button>
      <span id="yaml-save-status"></span>
    </div>
    <div id="yaml-editor-wrap">
      <textarea id="yaml-editor" spellcheck="false" placeholder="Wybierz plik YAML z panelu po lewej stronie…"></textarea>
    </div>
    <div id="yaml-error"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════
// Stan
// ════════════════════════════════════════════════
const API = '';
let _pendingFiles = [];
let _session      = null;
let _currentFile  = null;
let _currentYaml  = null;
let _yamlDirty    = false;

// ════════════════════════════════════════════════
// Przełączanie zakładek
// ════════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    if (tab.dataset.panel === 'yaml' && !_currentYaml) loadYamlFileList();
  });
});

// ════════════════════════════════════════════════
// WCZYTYWANIE
// ════════════════════════════════════════════════
const dropzone      = document.getElementById('dropzone');
const fileInput     = document.getElementById('file-input');
const folderInput   = document.getElementById('folder-input');
const btnProcess    = document.getElementById('btn-process');
const btnBrowse     = document.getElementById('btn-browse-files');
const btnFolder     = document.getElementById('btn-browse-folder');
const btnClear      = document.getElementById('btn-clear');
const fileList      = document.getElementById('file-list');
const progressArea  = document.getElementById('progress-area');
const progressFill  = document.getElementById('progress-fill');
const progressLabel = document.getElementById('progress-label');

function addFiles(files) {
  for (const f of files) {
    if (f.name.toLowerCase().endsWith('.pdf') && !_pendingFiles.find(x => x.name === f.name)) {
      _pendingFiles.push(f);
    }
  }
  renderFileList();
}

function renderFileList() {
  fileList.innerHTML = '';
  _pendingFiles.forEach((f, i) => {
    const pill = document.createElement('div');
    pill.className = 'file-pill';
    pill.innerHTML =
      `<span>${f.name} <small style="color:#9099b4">(${(f.size/1024).toFixed(0)} KB)</small></span>` +
      `<button class="rm" data-idx="${i}" title="Usuń">x</button>`;
    fileList.appendChild(pill);
  });
  fileList.querySelectorAll('.rm').forEach(rm => {
    rm.addEventListener('click', () => {
      _pendingFiles.splice(parseInt(rm.dataset.idx), 1);
      renderFileList();
    });
  });
  btnProcess.disabled = _pendingFiles.length === 0;
}

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  function traverse(entry) {
    if (entry.isFile) {
      entry.file(f => { if (f.name.toLowerCase().endsWith('.pdf')) addFiles([f]); });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      reader.readEntries(entries => entries.forEach(en => traverse(en)));
    }
  }
  if (e.dataTransfer.items) {
    for (const item of e.dataTransfer.items) {
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry) traverse(entry);
      else if (item.kind === 'file') addFiles([item.getAsFile()]);
    }
  } else {
    addFiles([...e.dataTransfer.files]);
  }
});

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });
btnBrowse.addEventListener('click', () => fileInput.click());
btnFolder.addEventListener('click', () => folderInput.click());
btnClear.addEventListener('click', () => { _pendingFiles = []; renderFileList(); });

fileInput.addEventListener('change', () => { addFiles([...fileInput.files]); fileInput.value = ''; });
folderInput.addEventListener('change', () => {
  addFiles([...folderInput.files].filter(f => f.name.toLowerCase().endsWith('.pdf')));
  folderInput.value = '';
});

btnProcess.addEventListener('click', async () => {
  if (!_pendingFiles.length) return;
  btnProcess.disabled = true;
  progressArea.style.display = 'block';
  progressFill.style.width = '0%';
  progressLabel.textContent = `Przesyłanie ${_pendingFiles.length} pliku/plików…`;

  const fd = new FormData();
  _pendingFiles.forEach(f => fd.append('files', f, f.name));

  try {
    let fake = 0;
    const timer = setInterval(() => {
      fake = Math.min(fake + 3, 60);
      progressFill.style.width = fake + '%';
    }, 300);

    const resp = await fetch(`${API}/api/process`, { method: 'POST', body: fd });
    clearInterval(timer);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ error: resp.statusText }));
      alert('Błąd serwera: ' + (err.error || resp.statusText));
      return;
    }

    progressFill.style.width = '90%';
    progressLabel.textContent = 'Przetwarzanie… (może potrwać chwilę dla nowych plików)';

    _session = await resp.json();
    progressFill.style.width = '100%';
    progressLabel.textContent = `Gotowe — przetworzono ${_session.files.length} plik(ów)`;

    setTimeout(() => {
      document.querySelector('[data-panel="review"]').click();
      populateReview();
    }, 600);
  } catch (e) {
    alert('Błąd sieci: ' + e.message);
  } finally {
    btnProcess.disabled = false;
  }
});

// ════════════════════════════════════════════════
// PODGLĄD
// ════════════════════════════════════════════════
const fileSelector = document.getElementById('file-selector');
const reviewStatus = document.getElementById('review-status');
const pdfFrame     = document.getElementById('pdf-frame');
const pdfTextView  = document.getElementById('pdf-text-view');
const pdfLabel     = document.getElementById('pdf-label');
const jsonScroll   = document.getElementById('json-scroll');
const btnViewPdf   = document.getElementById('btn-view-pdf');
const btnViewText  = document.getElementById('btn-view-text');
const btnCopyJson  = document.getElementById('btn-copy-json');

let _textMode = false;

function populateReview() {
  if (!_session) return;
  fileSelector.innerHTML = '';
  _session.files.forEach((f, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = f.name + (f.error ? ' [blad]' : ` [${f.label || 'negatywny'}]`);
    fileSelector.appendChild(opt);
  });
  fileSelector.selectedIndex = 0;
  loadReviewFile(0);
}

fileSelector.addEventListener('change', () => {
  const idx = parseInt(fileSelector.value);
  if (!isNaN(idx)) loadReviewFile(idx);
});

function loadReviewFile(idx) {
  if (!_session || idx >= _session.files.length) return;
  _currentFile = _session.files[idx];
  pdfLabel.textContent = _currentFile.name;
  reviewStatus.textContent = _currentFile.error
    ? 'Blad: ' + _currentFile.error
    : `Klasa: ${_currentFile.label || 'negatywny'}`;
  reviewStatus.style.color = _currentFile.error ? '#c0392b' : '#1a7a1a';

  pdfFrame.src = `${API}/api/pdf/${_session.session_id}/${encodeURIComponent(_currentFile.name)}`;
  pdfTextView.textContent = _currentFile.text || '(brak tekstu)';
  renderJsonTree();
  if (_textMode) showTextView(); else showPdfView();
}

function showPdfView() {
  _textMode = false;
  pdfFrame.style.display = 'block';
  pdfTextView.style.display = 'none';
  btnViewPdf.style.background  = '#1d5cb4';
  btnViewPdf.style.color       = '#fff';
  btnViewPdf.style.borderColor = '#1d5cb4';
  btnViewText.style.background  = '';
  btnViewText.style.color       = '';
  btnViewText.style.borderColor = '';
}

function showTextView() {
  _textMode = true;
  pdfFrame.style.display = 'none';
  pdfTextView.style.display = 'block';
  btnViewPdf.style.background  = '';
  btnViewPdf.style.color       = '';
  btnViewPdf.style.borderColor = '';
  btnViewText.style.background  = '#1d5cb4';
  btnViewText.style.color       = '#fff';
  btnViewText.style.borderColor = '#1d5cb4';
}

btnViewPdf.addEventListener('click', showPdfView);
btnViewText.addEventListener('click', showTextView);

btnCopyJson.addEventListener('click', () => {
  if (!_currentFile) return;
  navigator.clipboard.writeText(JSON.stringify(_currentFile.json, null, 2))
    .then(() => {
      btnCopyJson.textContent = 'Skopiowano';
      setTimeout(() => { btnCopyJson.textContent = 'Kopiuj'; }, 1500);
    });
});

// ── drzewo JSON ──

function renderJsonTree() {
  jsonScroll.innerHTML = '';
  if (!_currentFile) return;
  const frag = document.createDocumentFragment();
  renderNode(_currentFile.json, '', 0, frag, _currentFile.provenance || {});
  jsonScroll.appendChild(frag);
}

function renderNode(value, path, depth, container, prov) {
  if (value === null || typeof value !== 'object') return;
  if (Array.isArray(value)) {
    value.forEach((item, i) => {
      const childPath = path ? `${path}[${i}]` : `[${i}]`;
      if (typeof item === 'object' && item !== null) {
        const row = makeRow(depth, `[${i}]`, null, '{...}', prov, childPath, false);
        const sub = document.createElement('div');
        renderNode(item, childPath, depth + 1, sub, prov);
        container.appendChild(row);
        container.appendChild(sub);
        row.querySelector('.jt-toggle')?.addEventListener('click', () => {
          sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
        });
      } else {
        container.appendChild(makeRow(depth, `[${i}]`, item, null, prov, childPath, true));
      }
    });
  } else {
    Object.entries(value).forEach(([k, v]) => {
      const childPath = path ? `${path}.${k}` : k;
      if (typeof v === 'object' && v !== null) {
        const label = Array.isArray(v) ? `[${v.length}]` : '{...}';
        const row = makeRow(depth, k, null, label, prov, childPath, false);
        const sub = document.createElement('div');
        renderNode(v, childPath, depth + 1, sub, prov);
        container.appendChild(row);
        container.appendChild(sub);
        row.querySelector('.jt-toggle')?.addEventListener('click', () => {
          sub.style.display = sub.style.display === 'none' ? 'block' : 'none';
        });
      } else {
        container.appendChild(makeRow(depth, k, v, null, prov, childPath, true));
      }
    });
  }
}

function makeRow(depth, key, leafValue, collapsedLabel, prov, path, isLeaf) {
  const row = document.createElement('div');
  row.className = 'jt-row';
  row.style.paddingLeft = (depth * 14) + 'px';

  const keySpan = document.createElement('span');
  keySpan.className = 'jt-key';
  keySpan.textContent = key;

  const sep = document.createElement('span');
  sep.className = 'jt-sep';
  sep.textContent = ': ';

  const valSpan = document.createElement('span');
  valSpan.className = 'jt-val';

  if (!isLeaf) {
    const tog = document.createElement('span');
    tog.className = 'jt-toggle';
    tog.textContent = 'v';
    tog.title = 'zwiń / rozwiń';
    valSpan.appendChild(tog);
    const lbl = document.createElement('span');
    lbl.textContent = ' ' + (collapsedLabel || '');
    lbl.style.color = '#9099b4';
    lbl.style.fontSize = '11px';
    valSpan.appendChild(lbl);
  } else {
    if (leafValue === null) {
      valSpan.textContent = 'null';
      valSpan.classList.add('null');
    } else if (typeof leafValue === 'number') {
      valSpan.textContent = leafValue;
      valSpan.classList.add('num');
    } else if (typeof leafValue === 'boolean') {
      valSpan.textContent = leafValue;
      valSpan.classList.add('bool');
    } else {
      valSpan.textContent = JSON.stringify(leafValue);
    }
  }

  // przycisk podświetlenia źródła
  const magBtn = document.createElement('button');
  magBtn.className = 'jt-prov';
  magBtn.title = 'Podświetl źródło w dokumencie';
  magBtn.textContent = '[?]';
  const provEntry = prov[path];
  if (isLeaf && provEntry && leafValue !== null) {
    magBtn.addEventListener('click', () => highlightProv(provEntry, leafValue));
  } else {
    magBtn.disabled = true;
  }

  row.appendChild(keySpan);
  row.appendChild(sep);
  row.appendChild(valSpan);
  row.appendChild(magBtn);
  return row;
}

function highlightProv(provEntry, value) {
  if (!_currentFile) return;
  const text = _currentFile.text || '';
  if (!text) return;

  showTextView();

  const valStr = String(value);
  const idx = text.indexOf(valStr);
  if (idx === -1) {
    pdfTextView.innerHTML = escapeHtml(text);
    return;
  }
  pdfTextView.innerHTML =
    escapeHtml(text.substring(0, idx)) +
    `<mark class="prov-hi">${escapeHtml(text.substring(idx, idx + valStr.length))}</mark>` +
    escapeHtml(text.substring(idx + valStr.length));
  const mark = pdfTextView.querySelector('mark.prov-hi');
  if (mark) mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ════════════════════════════════════════════════
// KONFIGURACJA YAML
// ════════════════════════════════════════════════
const yamlSidebar    = document.getElementById('yaml-sidebar');
const yamlFilename   = document.getElementById('yaml-filename');
const yamlEditor     = document.getElementById('yaml-editor');
const yamlError      = document.getElementById('yaml-error');
const btnYamlSave    = document.getElementById('btn-yaml-save');
const btnYamlReload  = document.getElementById('btn-yaml-reload');
const yamlSaveStatus = document.getElementById('yaml-save-status');

async function loadYamlFileList() {
  try {
    const r = await fetch(`${API}/api/yaml_list`);
    const data = await r.json();
    const h3 = yamlSidebar.querySelector('h3');
    yamlSidebar.innerHTML = '';
    yamlSidebar.appendChild(h3);
    data.files.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'yaml-file-btn';
      btn.textContent = f.name;
      btn.addEventListener('click', () => selectYamlFile(f.name, btn));
      yamlSidebar.appendChild(btn);
    });
  } catch (e) {
    console.error('Blad ladowania listy YAML', e);
  }
}

async function selectYamlFile(name, btn) {
  if (_yamlDirty && !confirm('Odrzucić niezapisane zmiany?')) return;
  yamlSidebar.querySelectorAll('.yaml-file-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  _currentYaml = name;
  yamlFilename.textContent = name;
  btnYamlSave.disabled   = false;
  btnYamlReload.disabled = false;
  yamlSaveStatus.textContent = '';
  yamlError.style.display = 'none';
  _yamlDirty = false;
  await reloadYamlContent();
}

async function reloadYamlContent() {
  if (!_currentYaml) return;
  try {
    const r = await fetch(`${API}/api/yaml/${_currentYaml}`);
    if (!r.ok) throw new Error(r.statusText);
    yamlEditor.value = await r.text();
    _yamlDirty = false;
    yamlSaveStatus.textContent = '';
  } catch (e) {
    yamlError.textContent = 'Blad ladowania: ' + e.message;
    yamlError.style.display = 'block';
  }
}

btnYamlReload.addEventListener('click', async () => {
  if (_yamlDirty && !confirm('Odrzucić niezapisane zmiany?')) return;
  await reloadYamlContent();
});

btnYamlSave.addEventListener('click', async () => {
  if (!_currentYaml) return;
  yamlError.style.display = 'none';
  yamlSaveStatus.textContent = '...';
  yamlSaveStatus.style.color = '#6b7385';
  try {
    const r = await fetch(`${API}/api/yaml/${_currentYaml}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'text/yaml' },
      body: yamlEditor.value,
    });
    const data = await r.json();
    if (!r.ok) {
      yamlError.textContent = data.error || r.statusText;
      yamlError.style.display = 'block';
      yamlSaveStatus.textContent = '';
    } else {
      _yamlDirty = false;
      yamlSaveStatus.textContent = 'Zapisano';
      yamlSaveStatus.style.color = '#1a7a1a';
      setTimeout(() => { yamlSaveStatus.textContent = ''; }, 2000);
    }
  } catch (e) {
    yamlError.textContent = 'Blad zapisu: ' + e.message;
    yamlError.style.display = 'block';
    yamlSaveStatus.textContent = '';
  }
});

yamlEditor.addEventListener('input', () => {
  _yamlDirty = true;
  yamlSaveStatus.textContent = 'Niezapisane zmiany';
  yamlSaveStatus.style.color = '#b05a00';
});

// Tab w edytorze YAML -> wcięcie spacjami
yamlEditor.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = yamlEditor.selectionStart, end = yamlEditor.selectionEnd;
    yamlEditor.value = yamlEditor.value.substring(0, s) + '  ' + yamlEditor.value.substring(end);
    yamlEditor.selectionStart = yamlEditor.selectionEnd = s + 2;
  }
});

// ════════════════════════════════════════════════
// Inicjalizacja
// ════════════════════════════════════════════════
loadYamlFileList();
</script>
